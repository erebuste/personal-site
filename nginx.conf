# Hashed build assets cache forever; media/uploads for a week; HTML and API always revalidate.
map $uri $cache_control {
    ~^/assets/   "public, max-age=31536000, immutable";
    ~^/media/    "public, max-age=604800";
    ~^/uploads/  "public, max-age=604800";
    default      "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Small by default so unauthenticated routes (/api/login) can't be fed huge JSON bodies; uploads get 101m below.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Images and media may be any https:// URL (the admin schema allows them); scripts and fetches stay same-origin.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The api rate-limits logins and counts views by the client IP it gets in X-Real-IP. Behind the host's reverse
    # proxy every request arrives from a Docker address, so take the visitor's IP from X-Forwarded-For instead, but
    # only when the request comes from Docker's own ranges (the published port is bound to 172.17.0.1). recursive:
    # skip trusted hops and use the last address the proxy didn't vouch for, so a client can't forge its own IP.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Missing hashed assets should 404, not fall through to the app.
    location /assets/ {
        try_files $uri =404;
    }

    # Files uploaded from /admin, straight off the shared volume.
    location /uploads/ {
        alias /data/uploads/;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:3001;
    }

    location = /api/admin/upload {
        client_max_body_size 101m;
        proxy_pass http://api:3001;
        proxy_request_buffering off;
    }

    # Static files if they exist, otherwise the api renders index.html with the profile's <head>.
    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://api:3001;
    }
}
