services:
  api:
    build: { context: ., target: api }
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (see .env.example)}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    volumes:
      - data:/data
    restart: unless-stopped
    # No ports: only reachable through nginx, which is what makes X-Real-IP trustworthy.

  web:
    build: { context: ., target: web }
    ports:
      - "3000:80"
    volumes:
      - data:/data:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  data:
